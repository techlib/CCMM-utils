name: Flatten XSD Schema

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Input path or GitHub URL to the XSD schema'
        required: true
        default: 'https://github.com/techlib/CCMM/tree/main'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml

      - name: Create output directory
        working-directory: flattenCCMM
        run: mkdir -p output

      - name: Run Flatten script
        working-directory: flattenCCMM
        run: |
          python scripts/flatten_schema.py -i "${{ github.event.inputs.input_path }}" -o "output/CCMM_flattened.xsd"

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flattened-xsd
          path: flattenCCMM/output/flattened.xsd

      - name: Commit and push generated XSD
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flattenCCMM/output/flattened.xsd
          git commit -m "build: update flattened XSD schema [skip ci]" || echo "No changes to commit"
          git push
